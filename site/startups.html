<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenStartup Atlas · Lingo Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#ffffff;--fg:#1d1d28;--muted:#666a7a;--line:#dcdde6;--accent:#1d5d86}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 Poppins,system-ui,sans-serif}
header{max-width:1100px;margin:0 auto;padding:16px}
header img{display:block;margin-bottom:12px}
h1{font-size:1.6rem;margin:.2rem 0}
p.lead{color:var(--muted);margin:.3rem 0 .8rem}
a{color:var(--accent)}
iframe{display:block;width:calc(100% - 32px);max-width:1100px;height:calc(100vh - 170px);min-height:600px;margin:0 auto 16px;border:1px solid var(--line);border-radius:8px}
@media (max-width:600px){iframe{height:70vh;min-height:480px}}
</style>
</head>
<body>
<header>
  <img src="logo.png" alt="Lingo Ledger" width="161" height="27">
  <p class="lead"><a href="/">&larr; Certified Translator Atlas</a></p>
  <img src="logo.png" alt="Lingo Ledger" height="27" style="display:block;margin-bottom:8px">
  <h1>OpenStartup Atlas</h1>
  <p class="lead">Startup accelerators with application deadlines, VCs, government grants and founder resources for every country, on one map. <a href="https://openstartup-qz7.pages.dev/" target="_blank" rel="noopener">Open the full site</a></p>
</header>
<iframe src="https://openstartup-qz7.pages.dev/" title="OpenStartup Atlas"></iframe>
</body>
</html>
